apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-for-all
  labels:
    app: food-for-all
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-for-all
  template:
    metadata:
      labels:
        app: food-for-all
    spec:
      containers:
        - name: food-for-all
          image: priyanshu8948/food-for-all-server:latest
          ports:
            - containerPort: 5000
          # Secrets come from a Kubernetes Secret, never hard-coded here.
          # Create it from k8s/secret.example.yml (see README).
          envFrom:
            - secretRef:
                name: food-for-all-secrets
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 20
