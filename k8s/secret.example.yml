# Copy to k8s/secret.yml (git-ignored), fill in real values, then:
#   kubectl apply -f k8s/secret.yml
# Or create it directly without a file:
#   kubectl create secret generic food-for-all-secrets \
#     --from-literal=MONGODB_URI='mongodb+srv://...' \
#     --from-literal=JWT_SECRET='...'
apiVersion: v1
kind: Secret
metadata:
  name: food-for-all-secrets
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://<user>:<password>@<cluster>/foodforall"
  JWT_SECRET: "change_me_to_a_long_random_string"
  JWT_EXPIRES_IN: "7d"
