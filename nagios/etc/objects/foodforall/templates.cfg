###############################################################################
# Food For All - templates: check every host and service once a minute
###############################################################################

define host {
    name                    foodforall-host
    use                     linux-server
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    register                0
}

define service {
    name                    foodforall-service
    use                     generic-service
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    contact_groups          admins
    register                0
}
