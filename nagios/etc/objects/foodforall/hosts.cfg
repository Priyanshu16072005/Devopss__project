###############################################################################
# Food For All - hosts (address = Docker service name on the foodnet network)
###############################################################################

define host {
    use             foodforall-host
    host_name       puppet
    alias           Puppet master
    address         puppet
}

define host {
    use             foodforall-host
    host_name       lb
    alias           HAProxy load balancer
    address         lb
}

define host {
    use             foodforall-host
    host_name       web1
    alias           Nginx web server 1
    address         web1
}

define host {
    use             foodforall-host
    host_name       web2
    alias           Nginx web server 2
    address         web2
}

define host {
    use             foodforall-host
    host_name       client
    alias           React frontend
    address         client
}

define host {
    use             foodforall-host
    host_name       server
    alias           Node.js API
    address         server
}

define host {
    use             foodforall-host
    host_name       mongo
    alias           MongoDB database
    address         mongo
}

define hostgroup {
    hostgroup_name  web-servers
    alias           Web servers
    members         web1,web2
}
