server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Forward API calls to the backend container (Docker DNS name "server")
    location /api/ {
        proxy_pass http://server:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts hashed file names in /assets, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Simple health endpoint for Docker / Nagios
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # React Router: send unknown paths to index.html so page refresh works
    location / {
        try_files $uri $uri/ /index.html;
    }
}
