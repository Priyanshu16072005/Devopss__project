# =============================================================
#  Food For All - application stack
#  Start:  docker compose up -d --build
#  App:    http://localhost:3000      API: http://localhost:5000/api/health
#
#  DevOps stack (Puppet + Nagios + load balancer) is in
#  docker-compose.devops.yml - see README.md
# =============================================================

name: food-for-all

services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db          # data survives `docker compose down`
   
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [foodnet]

  server:
    build: ./server
    image: ${DOCKER_USER:-priyanshu8948}/food-for-all-server:${TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/food-for-all}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    depends_on:
      mongo:
        condition: service_healthy   # wait until MongoDB really accepts connections
    ports:
      - "5000:5000"
    networks: [foodnet]

  client:
    build: ./client
    image: ${DOCKER_USER:-priyanshu8948}/food-for-all-client:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:80"
    networks: [foodnet]

volumes:
  mongo-data:

networks:
  foodnet:
    name: foodnet
